spring.application.name=cleanup_system
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3308}/${DB_NAME:cleanup_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MySqL11}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT (stateless auth). JWT_SECRET has no default on purpose — never bake a secret into code;
# set it in your environment before starting the backend (see .env.example for a dev value).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Bootstrap admin (AdminBootstrapRunner, see CLAUDE.md's Auth mechanism notes). Only required
# when no ADMIN account exists yet at startup — empty-string default (not a real default value)
# so this property always resolves cleanly; AdminBootstrapRunner treats a blank value as unset.
initial-admin.email=${INITIAL_ADMIN_EMAIL:}
initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# Verification document upload (local disk — see LocalDiskFileStorageService). Falls back to
# ./uploads/verification-documents (relative to wherever the backend is started from) if unset.
verification-docs.dir=${VERIFICATION_DOCS_DIR:./uploads/verification-documents}

# Multipart upload limits (verification document uploads).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (see SecurityConfig) — the origin allowed to call this API from a browser. Defaults to
# Vite's dev server port; override for any deployed frontend origin.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}