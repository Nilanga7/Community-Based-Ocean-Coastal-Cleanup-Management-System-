spring.application.name=cleanup_system
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3308}/${DB_NAME:cleanup_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MySqL11}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT (stateless auth). JWT_SECRET has no default on purpose — never bake a secret into code;
# set it in your environment before starting the backend (see .env.example for a dev value).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}