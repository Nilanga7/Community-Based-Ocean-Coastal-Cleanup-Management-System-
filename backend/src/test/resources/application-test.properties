# Test-only overrides layered on top of src/main/resources/application.properties via the
# "test" Spring profile. JWT_SECRET has no default in the main properties file (by design —
# see application.properties), so any @SpringBootTest that loads the full context needs this
# profile active. This secret is a fixture for tests only — never reuse it as a real deployment
# secret.
jwt.secret=cVZ1GJpbKUo/nJa6W9waGsZ8RmVHXI+dj39WYS/pltY=
jwt.expiration-ms=86400000

# AdminBootstrapRunner is a real ApplicationRunner, so it fires on every full @SpringBootTest's
# context startup. Without these set, it fails fast (by design) if no admin exists yet, which
# would crash every full-context test. Fixture values only — never reuse as real credentials.
initial-admin.email=bootstrap-test-admin@example.com
initial-admin.password=test-only-bootstrap-password
